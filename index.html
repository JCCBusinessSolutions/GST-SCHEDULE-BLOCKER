<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#002B5C" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="GST Events" />
<title>GST EVENTS BLOCKER</title>
<style>
:root{
  --navy:#002B5C;--deep:#001A3D;--gold:#C9A227;--light:#EAF2FB;--bg:#F5F7FA;--ink:#172B4D;--white:#fff;
  --serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--serif);color:var(--navy);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:#5b6b85}.small{font-size:12px}.center{text-align:center}
.gold-rule{height:4px;background:var(--gold)}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(0,26,61,.06),0 4px 16px rgba(0,26,61,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;transition:.15s;line-height:1.2}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover:not(:disabled){background:var(--deep)}
.btn-gold{background:var(--gold);color:var(--deep)}.btn-gold:hover:not(:disabled){filter:brightness(.95)}
.btn-outline{background:#fff;color:var(--navy);border-color:rgba(0,43,92,.3)}.btn-outline:hover:not(:disabled){background:var(--light)}
.btn-danger{background:#dc2626;color:#fff}
.btn-del{background:#fff;color:#b91c1c;border-color:#fca5a5}.btn-del:hover:not(:disabled){background:#fef2f2}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn-lg{padding:15px 20px;font-size:15px;width:100%}
.l{display:block;margin-bottom:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.input{display:block;width:100%;border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:10px 12px;font-size:14px}
.input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,43,92,.15)}
.input.err{border-color:#dc2626}
.ferr{color:#dc2626;font-size:12px;font-weight:600;margin-top:3px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;text-transform:capitalize;border:1px solid}
.b-draft{background:#f1f5f9;color:#334155;border-color:#cbd5e1}
.b-published{background:#ecfdf5;color:#065f46;border-color:#6ee7b7}
.b-archived{background:#fffbeb;color:#92400e;border-color:#fcd34d}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite;display:inline-block}
.spin.dark{border-color:rgba(0,43,92,.2);border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}

/* layout */
.shell{min-height:100vh;display:flex}
.side{width:260px;flex-shrink:0;background:var(--navy);color:#fff;padding:20px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:12px}
.brand .n{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.03em;line-height:1.1;color:#fff}
.brand .t{font-size:10.5px;font-weight:700;letter-spacing:.17em;color:var(--gold)}
.side .brand{padding-bottom:18px;margin-bottom:12px;border-bottom:2px solid var(--gold)}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:11px 12px;color:rgba(255,255,255,.88);font-weight:600;font-size:14px;cursor:pointer}
.nav:hover{background:rgba(255,255,255,.1)}
.nav.on{background:rgba(255,255,255,.1);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(201,162,39,.6)}
.main{flex:1;min-width:0;padding:32px}
.topbar{display:none;background:var(--navy);padding:12px 16px;position:sticky;top:0;z-index:30;align-items:center;justify-content:space-between}
.burger{background:none;border:0;color:#fff;padding:6px;cursor:pointer}
.mnav{display:none;background:var(--navy);padding:0 16px 14px}
.page-h h1{font-size:30px}.page-h .bar{width:64px;height:4px;background:var(--gold);margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.stat{padding:16px;border-top:4px solid var(--gold)}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#64748b}
.stat .v{font-family:var(--serif);font-size:38px;font-weight:700;color:var(--navy)}
.panel{padding:24px;margin-top:20px}
.panel-h{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:2.2fr 1.4fr 1.2fr 1.4fr;gap:6px 14px;padding:14px 0;border-bottom:1px solid #eef2f7;align-items:start}
.row .ttl{font-weight:700;color:var(--navy)}
.row .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.head{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:8px}
.empty{border:1px dashed rgba(0,43,92,.25);background:rgba(234,242,251,.6);border-radius:12px;padding:36px 20px;text-align:center}
.empty b{font-family:var(--serif);font-size:18px;color:var(--navy);display:block;margin-bottom:6px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px}
.notice{border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.n-warn{background:#fffbeb;color:#78350f}
.n-info{background:var(--light);color:var(--navy)}
.n-err{background:#fef2f2;color:#991b1b}
.n-ok{background:#ecfdf5;color:#064e3b}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,26,61,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{position:relative;background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal.wide{max-width:660px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
.modal .mh h2{font-size:21px}
.modal .mb{padding:0 20px 18px;overflow-y:auto}
.modal .mf{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid #eef2f7}
.x{background:none;border:0;font-size:22px;line-height:1;color:#64748b;cursor:pointer;padding:4px 8px;border-radius:8px}
.x:hover{background:#f1f5f9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{margin-bottom:14px}
fieldset.rem,fieldset.rec{border:1px solid rgba(201,162,39,.7);background:rgba(234,242,251,.6);border-radius:12px;padding:12px 14px;margin:0 0 14px}
fieldset.rem legend,fieldset.rec legend{padding:0 8px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
fieldset.rem label{display:flex;gap:10px;align-items:flex-start;padding:4px 0;cursor:pointer}
fieldset.rem input{margin-top:3px;width:16px;height:16px;accent-color:var(--navy)}
.qrbox{width:100%;max-width:280px;aspect-ratio:1;margin:14px auto 0;border:4px solid var(--gold);border-radius:12px;background:#fff;padding:4px;display:flex;align-items:center;justify-content:center}
.qrbox img{width:100%;height:100%;display:block;image-rendering:pixelated}
.linkbox{word-break:break-all;background:var(--light);color:var(--navy);border-radius:8px;padding:8px 10px;font-size:11px;margin-top:12px;max-height:84px;overflow:auto}
.toasts{position:fixed;left:0;right:0;bottom:14px;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 14px;pointer-events:none}
.toast{max-width:460px;width:100%;border-left:4px solid;border-radius:10px;padding:11px 14px;font-weight:600;font-size:13.5px;box-shadow:0 6px 20px rgba(0,26,61,.18);background:#fff}
.toast.success{border-color:#10b981;background:#ecfdf5;color:#064e3b}
.toast.error{border-color:#ef4444;background:#fef2f2;color:#7f1d1d}
.toast.info{border-color:var(--navy);background:var(--light);color:var(--navy)}
.sel-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #eef2f7}
.sel-row input{margin-top:4px;width:16px;height:16px;accent-color:var(--navy)}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{position:relative;display:inline-block}
.pill input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pill span{display:inline-flex;width:38px;height:38px;align-items:center;justify-content:center;border-radius:50%;border:1px solid #cbd5e1;background:#fff;font-weight:700;font-size:13px;color:var(--navy)}
.pill input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}

/* public */
.pub{min-height:100vh;display:flex;flex-direction:column}
.pub header{background:var(--navy)}
.pub header .in{max-width:760px;margin:0 auto;padding:14px 16px}
.pub main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:24px 16px 40px}
.pub footer{background:var(--deep);color:var(--gold);text-align:center;font-size:12px;font-weight:700;letter-spacing:.2em;padding:18px}
.pcard{overflow:hidden;margin-bottom:18px}
.pcard .tag{background:var(--light);padding:10px 20px;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--navy)}
.pcard .body{padding:22px}
.pcard h1{font-size:30px;line-height:1.15}
.pcard .bar{width:56px;height:4px;background:var(--gold);margin:12px 0 18px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 18px}
.dl dd{margin:0;font-weight:700;font-size:16px}
.remind{border:1px solid rgba(201,162,39,.7);background:rgba(234,242,251,.6);border-radius:12px;padding:14px;margin:18px 0}
.remind h2{font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.remind li{margin:3px 0}
.remind ul.r{list-style:none;padding:0;margin:8px 0 0}
.remind ul.r li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px}
.remind ul.n{margin:10px 0 0;padding-left:18px;font-size:12px;color:#475569}
.stack{display:flex;flex-direction:column;gap:10px}

/* print */
#print-root{display:none}
@page{size:A4;margin:10mm}
@media print{
  html,body{background:#fff!important}
  #app,#toasts,#modal{display:none!important}
  #print-root{display:block!important}
  .psheet{page-break-after:always;break-after:page}
  .psheet:last-child{page-break-after:auto;break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

@media (max-width:900px){
  .shell{display:block}
  .side{display:none}
  .topbar{display:flex}
  .mnav.open{display:block}
  .main{padding:16px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .filters{grid-template-columns:1fr 1fr}
  .filters .q{grid-column:1/-1}
  .row{grid-template-columns:1fr 1fr}
  .row .c-title{grid-column:1/-1}
  .panel{padding:16px}
  .grid2{grid-template-columns:1fr 1fr}
  .modal{align-self:flex-end;border-bottom-left-radius:0;border-bottom-right-radius:0}
  .ov{align-items:flex-end;padding:0}
  .dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="print-root"></div>
<noscript>GST EVENTS BLOCKER needs JavaScript enabled.</noscript>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

  if (!validTz(w.z) || isNaN(new Date(w.s)) || isNaN(new Date(w.e)) || !(new Date(w.e) > new Date(w.s))) return null;
  return { id: String(w.i || ''), title: w.t.slice(0, 200), desc: String(w.d || '').slice(0, 5000), start: new Date(w.s).toISOString(), end: new Date(w.e).toISOString(), tz: w.z, venue: String(w.v || '').slice(0, 300), r1d: !!w.a, r1h: !!w.b, rec: cleanRec(w.r) };
}
function baseUrl() {
  var p = (settings.publicUrl || '').trim();
  if (p) { try { var u = new URL(p); if (u.protocol === 'http:' || u.protocol === 'https:') return u.href.split('#')[0]; } catch (e) { /* ignore */ } }
  if (location.protocol === 'http:' || location.protocol === 'https:') return location.href.split('#')[0];
  return null;
}
var NO_BASE = 'QR codes need a web address. This file is open from your computer (file://), so set “Public web address of this page” in Settings after you upload this file to a website (see the Settings page).';
function eventLink(e) {
  var b = baseUrl(); if (!b) return Promise.reject(new Error(NO_BASE));
  return encodePayload(toWire(e)).then(function (p) { return b + '#/e/' + p; });
}
function upcomingPublished() {
  return events.filter(function (e) { return e.status === 'published' && !isPast(e); }).sort(function (a, b) { return occStartMs(a) - occStartMs(b); });
}
function listLink() {

}

/* ---------- QR ---------- */
function makeQr(text) {
  var levels = ['H', 'Q', 'M', 'L'];
  for (var i = 0; i < levels.length; i++) {
    try { var q = qrcode(0, levels[i]); q.addData(text, 'Byte'); q.make(); return { q: q, level: levels[i] }; } catch (e) { /* try lower correction */ }
  }
  throw new Error('This link is too long for a QR code. Shorten the event description and try again.');
}
function qrCanvas(text, size) {
  var r = makeQr(text), n = r.q.getModuleCount(), quiet = 4, total = n + quiet * 2;
  var cell = Math.max(1, Math.floor((size || 1024) / total)), px = cell * total;
  var c = document.createElement('canvas'); c.width = c.height = px;
  var g = c.getContext('2d'); g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, px, px); g.fillStyle = settings.qrColor || '#002B5C';
  for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) if (r.q.isDark(y, x)) g.fillRect((x + quiet) * cell, (y + quiet) * cell, cell, cell);
  return { canvas: c, level: r.level, modules: n };
}
function qrFor(link) { return Promise.resolve().then(function () { return qrCanvas(link, 1024); }); }

  return { f: fr, n: parseInt($('f-rn').value, 10) || 1, w: w, u: end === 'until' ? $('f-ru').value : '', c: end === 'count' ? (parseInt($('f-rc').value, 10) || 0) : 0 };

function updateRec() {

function setErr(idn, msg) { var m = $('e-' + idn), i = $(idn); if (m) m.textContent = msg; if (i) i.classList.add('err'); }

function saveForm(mode) {

document.addEventListener('change', function (ev) {
  var t = ev.target, a = t.getAttribute && t.getAttribute('data-a');
  if (a === 'sel') { ui.selected[t.getAttribute('data-id')] = t.checked; renderAdmin(); return; }
  if (a === 'selall') {
    var list = events.filter(function (e) { return e.status === 'published' && (ui.showPast || !isPast(e)); });
    list.forEach(function (e) { ui.selected[e.id] = t.checked; }); renderAdmin(); return;
  }
  if (a === 'showpast') { ui.showPast = t.checked; renderAdmin(); return; }
  if ((t.id && /^f-(rf|rn|re|ru|rc|st|ed|et|tz)$/.test(t.id)) || (t.classList && t.classList.contains('rw'))) { updateRec(); return; }
  if (t.id === 'flt-status') { ui.status = t.value; ui.page = 1; renderAdmin(); }
  else if (t.id === 'flt-time') { ui.time = t.value; ui.page = 1; renderAdmin(); }
  else if (t.id === 'flt-sort') { ui.sort = t.value; renderAdmin(); }
  else if (t.id === 'f-sd') {
    var ed = $('f-ed'), prevS = t.getAttribute('data-prev'); if (ed && (!ed.value || ed.value < t.value || ed.value === prevS)) ed.value = t.value;
    if (validDate(prevS) && validDate(t.value)) { // keep the weekly day in step with the start date unless the user picked their own days
      var boxes = Array.prototype.slice.call(document.querySelectorAll('#modal .rw')), chosen = boxes.filter(function (c) { return c.checked; });
      if (chosen.length === 1 && +chosen[0].getAttribute('data-d') === dowOf(prevS)) boxes.forEach(function (c) { c.checked = +c.getAttribute('data-d') === dowOf(t.value); });
    }
    t.setAttribute('data-prev', t.value); updateRec();
  }
  else if (t.id === 'import-file') {
    var file = t.files && t.files[0]; if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result);
        if (!d || d.app !== 'gst-events-blocker' || !Array.isArray(d.events)) throw new Error('This is not a GST EVENTS BLOCKER backup file.');
        var clean = d.events.filter(function (e) { return e && e.id && e.title && !isNaN(new Date(e.start)) && !isNaN(new Date(e.end)) && validTz(e.tz); }).map(function (e) { e.rec = cleanRec(e.rec); return e; });
        if (!confirm('Replace the ' + events.length + ' event(s) in this browser with ' + clean.length + ' event(s) from the backup?')) return;
        events = clean; if (d.settings && typeof d.settings === 'object') settings = Object.assign({}, DEFAULTS, d.settings);
        if (persist()) { toast('Backup imported.', 'success'); renderAdmin(); }
      } catch (err) { toast(err.message || 'Could not read that backup file.', 'error'); }
    };
    rd.onerror = function () { toast('Could not read that file.', 'error'); };
    rd.readAsText(file); t.value = '';
  }
});

var searchTimer;
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'f-rn' || ev.target.id === 'f-rc') updateRec();
  if (ev.target.id === 'flt-q') {
    ui.q = ev.target.value; ui.page = 1; clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { var pos = ui.q.length; renderAdmin(); var el = $('flt-q'); if (el && document.activeElement === document.body) { el.focus(); el.setSelectionRange(pos, pos); } }, 200);
  }
});

document.addEventListener('submit', function (ev) {
  if (ev.target.id === 'ev-form') { ev.preventDefault(); saveForm('save'); }
  if (ev.target.id === 'settings-form') {
    ev.preventDefault();
    var name = $('s-name').value.trim(), tag = $('s-tag').value.trim(), tz = $('s-tz').value, url = $('s-url').value.trim(), qc = $('s-qr').value;
    var err = function (m) { $('s-err').innerHTML = '<div class="notice n-err" style="margin:0 0 12px">' + esc(m) + '</div>'; };
    if (!name) return err('Application name is required.');
    if (!tag) return err('Tagline is required.');
    if (!validTz(tz)) return err('Choose a valid time zone.');
    if (url) { try { var u = new URL(url); if (u.protocol !== 'http:' && u.protocol !== 'https:') throw 0; url = u.href.split('#')[0]; } catch (e) { return err('The web address must be a full address such as https://your-site.com/gst-events-blocker.html'); } }
    if (!/^#[0-9A-Fa-f]{6}$/.test(qc)) return err('QR color must be a hex color.');
    var old = Object.assign({}, settings);
    settings = Object.assign({}, settings, { appName: name, tagline: tag, tz: tz, publicUrl: url, qrColor: qc.toUpperCase() });
    if (persist()) { toast('Settings saved.', 'success'); renderAdmin(); } else settings = old;
  }
});

document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && $('modal').innerHTML) closeModal(); });
window.addEventListener('hashchange', route);
route();
})();

</script>
</body>
